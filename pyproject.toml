[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.3.0"
description = "Event-sourced card-fraud sentinel: append-only SQLite log, replayable projections, analyst console"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nathaniel Gordon" }]
keywords = ["event-sourcing", "cqrs", "fraud-detection", "sqlite", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
packages = [
    "sentinel",
    "sentinel.commands",
    "sentinel.detection",
    "sentinel.domain",
    "sentinel.projections",
    "sentinel.query",
    "sentinel.store",
    "sentinel.ui",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ISC", "PL"]
ignore = [
    "E501",     # long lines are caught by the formatter, not worth failing a build over
    "PLR0913",  # constructors here take a lot of collaborators by design
    "PLR2004",  # magic numbers are readable in rule thresholds and table widths
    "PLR0912",  # renderers branch a lot
    "PLR0915",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["sentinel", "tests"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinel"]
branch = false
