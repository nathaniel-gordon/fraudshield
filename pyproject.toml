[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.3.0"
description = "Event-sourced card-fraud sentinel: append-only SQLite log, replayable projections, analyst console"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nathaniel Gordon" }]
keywords = ["event-sourcing", "cqrs", "fraud-detection", "sqlite", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
packages = [
    "sentinel",
    "sentinel.commands",
    "sentinel.detection",
    "sentinel.domain",
    "sentinel.projections",
    "sentinel.query",
    "sentinel.store",
    "sentinel.ui",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ISC", "PL"]
ignore = [
    "E501",     # long lines are caught by the formatter, not worth failing a build over
    "PLR0913",  # constructors here take a lot of collaborators by design
    "PLR2004",  # magic numbers are readable in rule thresholds and table widths
    "PLR0912",  # renderers branch a lot
    "PLR0915",
    "PLR0911",  # the audit describer is a flat dispatch over the event vocabulary
    "PLR0917",
    "B008",
    "PLW0603",  # ansi caches the resolved charset in one module-level global
    "UP042",    # Disposition is a str Enum so payloads serialise without a hook
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside a function on purpose: to keep a module out of the import
# graph until the test that needs it runs, and to prove an import is optional.
"tests/*" = ["PLR2004", "E402", "PLC0415", "B905", "SIM117", "PLW1510", "B017", "RUF015"]
# msvcrt/termios are platform-specific and ansi's ctypes call is Windows-only; each
# must not be imported until the branch that needs it runs.
"sentinel/ui/keys.py" = ["PLC0415"]
"sentinel/ui/ansi.py" = ["PLC0415"]
# scikit-learn loads only when a model is actually fitted; the read side must run
# without it (test_security_regressions pins this).
"sentinel/detection/ensemble.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
files = ["sentinel", "tests"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# termios and tty are POSIX-only. Their attributes are simply absent from a
# Windows-hosted typeshed, and the branch that uses them cannot run there either.
module = "sentinel.ui.keys"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinel"]
branch = false
