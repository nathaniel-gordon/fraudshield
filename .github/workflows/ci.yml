name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows is first because this is a Windows-first project: the console
    # charset fallback and the key reader only differ there.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov ruff mypy

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest tests --cov=sentinel --cov-fail-under=75

      - name: Demo runs end to end
        run: python -m sentinel --log ci.db build --cards 60 --days 10

      - name: The log it wrote verifies
        run: python -m sentinel --log ci.db --json verify
